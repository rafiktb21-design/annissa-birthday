<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <!-- Cake Gradients -->
    <linearGradient id="cakeCream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2E8" />
      <stop offset="50%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFE8DB" />
    </linearGradient>
    <linearGradient id="cakePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4C7D5" />
      <stop offset="50%" stop-color="#FCEEF2" />
      <stop offset="100%" stop-color="#EAA6BC" />
    </linearGradient>
    <linearGradient id="standGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A063" />
      <stop offset="50%" stop-color="#E7CD9B" />
      <stop offset="100%" stop-color="#BA9558" />
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="40%" stop-color="#FFC857" />
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0" />
    </radialGradient>
    <filter id="cakeDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#674A49" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Cake Stand -->
  <g filter="url(#cakeDropShadow)">
    <path d="M 60 320 Q 160 338 260 320 L 265 328 Q 160 348 55 328 Z" fill="url(#standGold)" />
    <path d="M 145 325 L 140 355 L 125 365 L 195 365 L 180 355 L 175 325 Z" fill="url(#standGold)" />
    <ellipse cx="160" cy="320" rx="105" ry="12" fill="#E2C58E" />
  </g>

  <!-- Bottom Cake Tier -->
  <g filter="url(#cakeDropShadow)">
    <path d="M 75 250 L 75 310 C 75 328 245 328 245 310 L 245 250 Z" fill="url(#cakePink)" />
    <ellipse cx="160" cy="250" rx="85" ry="15" fill="#FFE8DB" />
    <!-- Drip Frosting -->
    <path d="M 75 250 C 85 270 95 270 105 256 C 115 275 125 275 135 258 C 145 278 155 278 165 256 C 175 276 185 276 195 258 C 205 274 215 274 225 256 C 235 270 245 265 245 250 Z" fill="#FFFDF9" opacity="0.95" />
    <!-- Pearls on bottom border -->
    <g fill="#D8B77E" opacity="0.8">
      <circle cx="90" cy="314" r="3" /><circle cx="110" cy="318" r="3" />
      <circle cx="130" cy="321" r="3" /><circle cx="150" cy="322" r="3" />
      <circle cx="170" cy="322" r="3" /><circle cx="190" cy="321" r="3" />
      <circle cx="210" cy="318" r="3" /><circle cx="230" cy="314" r="3" />
    </g>
  </g>

  <!-- Top Cake Tier -->
  <g filter="url(#cakeDropShadow)">
    <path d="M 105 185 L 105 245 C 105 260 215 260 215 245 L 215 185 Z" fill="url(#cakeCream)" />
    <ellipse cx="160" cy="185" rx="55" ry="11" fill="#FCEEF2" />
    <!-- Top Drips -->
    <path d="M 105 185 C 115 200 123 200 130 190 C 140 205 148 205 155 188 C 165 204 173 204 180 189 C 190 203 198 201 205 188 C 210 195 215 192 215 185 Z" fill="#EFAEBF" opacity="0.9" />
  </g>

  <!-- Cream Rosettes -->
  <g>
    <circle cx="120" cy="184" r="6" fill="#FFFDF9" stroke="#EFAEBF" stroke-width="1"/>
    <circle cx="140" cy="187" r="6" fill="#FFFDF9" stroke="#EFAEBF" stroke-width="1"/>
    <circle cx="160" cy="188" r="6" fill="#FFFDF9" stroke="#EFAEBF" stroke-width="1"/>
    <circle cx="180" cy="187" r="6" fill="#FFFDF9" stroke="#EFAEBF" stroke-width="1"/>
    <circle cx="200" cy="184" r="6" fill="#FFFDF9" stroke="#EFAEBF" stroke-width="1"/>
  </g>

  <!-- Candle Stems (Always visible) -->
  <g>
    <rect x="157" y="140" width="6" height="42" rx="2" fill="#EFAEBF" stroke="#C98299" stroke-width="0.8" />
    <line x1="160" y1="140" x2="160" y2="134" stroke="#674A49" stroke-width="1.5" stroke-linecap="round" />

    <rect x="135" y="147" width="5" height="36" rx="2" fill="#F6C6B3" stroke="#D8B77E" stroke-width="0.8" />
    <line x1="137.5" y1="147" x2="137.5" y2="142" stroke="#674A49" stroke-width="1.2" stroke-linecap="round" />

    <rect x="180" y="147" width="5" height="36" rx="2" fill="#F6C6B3" stroke="#D8B77E" stroke-width="0.8" />
    <line x1="182.5" y1="147" x2="182.5" y2="142" stroke="#674A49" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Flames (Targeted with class for dynamic blowout) -->
  <g id="cake-flames" class="cake-flames">
    <!-- Center Candle Flame -->
    <circle cx="160" cy="125" r="14" fill="url(#flameGlow)" />
    <path d="M 160 118 Q 165 127 160 134 Q 155 127 160 118 Z" fill="#FFB703" />
    <path d="M 160 123 Q 163 128 160 133 Q 157 128 160 123 Z" fill="#FFF8E7" />

    <!-- Left Candle Flame -->
    <circle cx="137.5" cy="133" r="11" fill="url(#flameGlow)" />
    <path d="M 137.5 127 Q 141.5 134 137.5 141 Q 133.5 134 137.5 127 Z" fill="#FFB703" />
    <path d="M 137.5 131 Q 140 135 137.5 140 Q 135 135 137.5 131 Z" fill="#FFF8E7" />

    <!-- Right Candle Flame -->
    <circle cx="182.5" cy="133" r="11" fill="url(#flameGlow)" />
    <path d="M 182.5 127 Q 186.5 134 182.5 141 Q 178.5 134 182.5 127 Z" fill="#FFB703" />
    <path d="M 182.5 131 Q 185 135 182.5 140 Q 180 135 182.5 131 Z" fill="#FFF8E7" />
  </g>

  <!-- Elegant 21 Cake Topper -->
  <g transform="translate(160, 95) scale(0.85)">
    <circle cx="0" cy="0" r="18" fill="#FFFDF9" stroke="#D8B77E" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Playfair Display', serif" font-weight="700" font-size="16" fill="#C98299" text-anchor="middle">21</text>
  </g>
</svg>
