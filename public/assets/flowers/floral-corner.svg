<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="petalPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="60%" stop-color="#F7DCE5" />
      <stop offset="100%" stop-color="#EFAEBF" />
    </radialGradient>
    <radialGradient id="petalPeach" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9F5" />
      <stop offset="70%" stop-color="#F6C6B3" />
      <stop offset="100%" stop-color="#EAA68F" />
    </radialGradient>
    <radialGradient id="leafGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B2C2A3" />
      <stop offset="100%" stop-color="#889C77" />
    </radialGradient>
  </defs>
  <!-- Vine Stem -->
  <path d="M 10 190 Q 60 140 70 80 T 150 20" fill="none" stroke="#D8B77E" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 20 180 Q 80 160 120 100 T 180 30" fill="none" stroke="#D8B77E" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Leaves -->
  <path d="M 45 130 C 35 115 50 95 65 110 C 60 125 50 135 45 130 Z" fill="url(#leafGrad)" opacity="0.75"/>
  <path d="M 90 85 C 80 70 100 50 115 65 C 105 80 95 90 90 85 Z" fill="url(#leafGrad)" opacity="0.7"/>
  <path d="M 130 50 C 120 35 140 25 150 40 C 145 52 135 55 130 50 Z" fill="url(#leafGrad)" opacity="0.6"/>

  <!-- Main Blossom (Soft Pink Rose) -->
  <g transform="translate(65, 85)">
    <!-- Outer Petals -->
    <circle cx="0" cy="-14" r="14" fill="url(#petalPink)" opacity="0.9"/>
    <circle cx="13" cy="-5" r="14" fill="url(#petalPink)" opacity="0.9"/>
    <circle cx="9" cy="11" r="14" fill="url(#petalPink)" opacity="0.9"/>
    <circle cx="-9" cy="11" r="14" fill="url(#petalPink)" opacity="0.9"/>
    <circle cx="-13" cy="-5" r="14" fill="url(#petalPink)" opacity="0.9"/>
    <!-- Inner Swirl -->
    <circle cx="0" cy="0" r="11" fill="url(#petalPink)"/>
    <path d="M -5 -3 Q 0 -8 5 -3 Q 8 4 0 7 Q -7 3 -5 -3 Z" fill="#C98299" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#D8B77E"/>
  </g>

  <!-- Secondary Blossom (Soft Peach) -->
  <g transform="translate(130, 40) scale(0.75)">
    <circle cx="0" cy="-12" r="12" fill="url(#petalPeach)" opacity="0.85"/>
    <circle cx="11" cy="-4" r="12" fill="url(#petalPeach)" opacity="0.85"/>
    <circle cx="7" cy="9" r="12" fill="url(#petalPeach)" opacity="0.85"/>
    <circle cx="-7" cy="9" r="12" fill="url(#petalPeach)" opacity="0.85"/>
    <circle cx="-11" cy="-4" r="12" fill="url(#petalPeach)" opacity="0.85"/>
    <circle cx="0" cy="0" r="8" fill="#FFF6F0"/>
    <circle cx="0" cy="0" r="3" fill="#D8B77E"/>
  </g>

  <!-- Tiny Gold Buds & Berries -->
  <circle cx="35" cy="155" r="3" fill="#D8B77E" opacity="0.8"/>
  <circle cx="42" cy="162" r="2" fill="#D8B77E" opacity="0.6"/>
  <circle cx="100" cy="115" r="3" fill="#EFAEBF" opacity="0.8"/>
  <circle cx="165" cy="25" r="2.5" fill="#D8B77E" opacity="0.9"/>
</svg>
