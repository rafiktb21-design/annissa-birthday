<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sideFlower" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="60%" stop-color="#F7DCE5"/>
      <stop offset="100%" stop-color="#EFAEBF"/>
    </radialGradient>
    <radialGradient id="sideLeaf" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B2C2A3"/>
      <stop offset="100%" stop-color="#889C77"/>
    </radialGradient>
  </defs>
  <!-- Main wavy vine -->
  <path d="M 15 0 Q 35 100 15 200 T 25 400" fill="none" stroke="#D8B77E" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
  <path d="M 12 20 Q 30 110 12 210 T 22 390" fill="none" stroke="#D8B77E" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Flower 1 (top, y=60) -->
  <g transform="translate(25, 60)">
    <circle cx="0" cy="0" r="10" fill="url(#sideFlower)" />
    <circle cx="0" cy="0" r="3" fill="#D8B77E" />
    <path d="M -8 -8 C -18 -12 -12 -2 -4 -4 Z" fill="url(#sideLeaf)" opacity="0.8" />
  </g>

  <!-- Leaves along stem -->
  <path d="M 24 120 C 36 114 38 126 28 130 Z" fill="url(#sideLeaf)" opacity="0.8" />
  <path d="M 16 150 C 4 142 8 158 18 156 Z" fill="url(#sideLeaf)" opacity="0.7" />

  <!-- Flower 2 (middle, y=210) -->
  <g transform="translate(18, 210)">
    <circle cx="0" cy="0" r="12" fill="url(#sideFlower)" />
    <circle cx="0" cy="0" r="3.5" fill="#C98299" />
    <path d="M 8 -8 C 18 -14 20 -2 10 2 Z" fill="url(#sideLeaf)" opacity="0.8" />
    <path d="M -8 8 C -18 14 -16 2 -6 -2 Z" fill="url(#sideLeaf)" opacity="0.8" />
  </g>

  <!-- Leaves along lower stem -->
  <path d="M 20 270 C 32 265 35 277 22 280 Z" fill="url(#sideLeaf)" opacity="0.8" />
  <path d="M 18 310 C 6 304 8 320 20 318 Z" fill="url(#sideLeaf)" opacity="0.7" />

  <!-- Flower 3 (bottom, y=350) -->
  <g transform="translate(25, 350)">
    <circle cx="0" cy="0" r="9" fill="url(#sideFlower)" />
    <circle cx="0" cy="0" r="2.5" fill="#D8B77E" />
    <path d="M -6 6 C -14 12 -12 2 -4 2 Z" fill="url(#sideLeaf)" opacity="0.8" />
  </g>
</svg>
