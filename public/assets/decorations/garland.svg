  <circle cx="200" cy="16" r="2" fill="#D8B77E" />
  <!-- Right dip (x=300, y=42) -->
  <circle cx="300" cy="42" r="7" fill="url(#glBlossom)" stroke="#D8B77E" stroke-width="0.75" />
  <circle cx="300" cy="42" r="2.5" fill="#C98299" />
  <path d="M 294 48 C 290 54 296 58 300 54 C 304 58 310 54 306 48 Z" fill="#889C77" opacity="0.8" />

  <!-- Tiny Gold fairy light sparkles along the garland -->
  <circle cx="45" cy="30" r="2" fill="#D8B77E" />
