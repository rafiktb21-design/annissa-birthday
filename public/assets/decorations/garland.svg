  </defs>
  <!-- Vine loop 1 -->
  <path d="M 0 15 Q 100 50 200 15 Q 300 50 400 15" fill="none" stroke="#D8B77E" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 0 18 Q 100 56 200 18 Q 300 56 400 18" fill="none" stroke="#D8B77E" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6" />

