<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="100%" height="100%">
  <defs>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="40%" stop-color="#F7DCE5"/>
      <stop offset="100%" stop-color="#EFAEBF"/>
    </linearGradient>
    <filter id="bowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#674A49" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Tails -->
  <path d="M 52 42 C 48 58 35 75 25 82 C 32 80 44 68 55 52 Z" fill="#EFAEBF" stroke="#D8B77E" stroke-width="0.8" filter="url(#bowShadow)" />
  <path d="M 68 42 C 72 58 85 75 95 82 C 88 80 76 68 65 52 Z" fill="#EFAEBF" stroke="#D8B77E" stroke-width="0.8" filter="url(#bowShadow)" />
  <!-- Left Loop -->
  <path d="M 60 40 C 45 20 15 15 15 35 C 15 50 45 46 60 42 Z" fill="url(#bowGrad)" stroke="#D8B77E" stroke-width="1" filter="url(#bowShadow)" />
  <path d="M 54 39 C 42 28 25 25 25 35 C 25 43 45 42 54 39 Z" fill="#F7DCE5" opacity="0.6" />
  <!-- Right Loop -->
  <path d="M 60 40 C 75 20 105 15 105 35 C 105 50 75 46 60 42 Z" fill="url(#bowGrad)" stroke="#D8B77E" stroke-width="1" filter="url(#bowShadow)" />
  <path d="M 66 39 C 78 28 95 25 95 35 C 95 43 75 42 66 39 Z" fill="#F7DCE5" opacity="0.6" />
  <!-- Center Knot -->
  <circle cx="60" cy="40" r="7.5" fill="#C98299" stroke="#D8B77E" stroke-width="1" filter="url(#bowShadow)" />
  <circle cx="60" cy="40" r="4.5" fill="#F7DCE5" opacity="0.8" />
</svg>
